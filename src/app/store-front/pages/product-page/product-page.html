@if ( producResource.isLoading() ) {
  <div class="flex justify-center items-center h-screen">
    <span class="loading loading-spinner loading-lg"></span>

  </div>
}

<!-- Producto -->

@if (producResource.hasValue()) {
  <div class="grid grid-cols-1 sm:grid-cols-2 gap-3">

    <!-- Imagenes -->
    <product-carousel [images]="producResource.value()?.images ?? []" />
    <!--  -->
    <div>
      <h2 class="text-2xl font-bold font-montserrat">
        {{producResource.value()?.title}}
      </h2>
      <div class="divider"></div>
      <p>
        {{producResource.value()?.description}}
      </p>
    </div>
  </div>


}
